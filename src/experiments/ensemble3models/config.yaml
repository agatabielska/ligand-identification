wandb:
  project: ligand-identification-ensembles
  experiment: experiment-2

# Leave unset for a unique UTC timestamp, or set this to reuse the run in train_head.
run_id: null

# Selected loss for all three backbones and the stacked tuning head.
loss:
  name: baseline
  label_smoothing: 0.1

ensemble:
  name: experiment-1-stacked-head
  data_path: /home/abielska/ligand-identification/data/unthresholded_transform_probabilistic
  epochs: 50
  # Early-stopping patience starts counting at unfreeze_epoch.
  patience: 10
  unfreeze_epoch: 10
  learning_rate: 0.001
  backbone_lr_scale: 0.1
  weight_decay: 0.00005
  feature_noise: 0.5
  loss: ${loss}

