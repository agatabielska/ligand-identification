defaults:
  - model: spectral_global_statistics
  - machine: hpc
  - _self_

train:
  epochs: 15
  out_channels: 97
  normalize_data: true
  precision: bf16-mixed
  gradient_clip_val: null
  early_stopping:
    patience: 15
    mode: min
    monitor: val_loss

paths:
  data_dir: data/unthresholded_transform_probabilistic
  model_checkpoint: checkpoints/

wandb:
  run_name: null

random_seed: 200

global_statistics:
  source: complete_input
