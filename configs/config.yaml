defaults:
  - model: clifford
  - machine: hpc
  - _self_

train:
  epochs: 100
  learning_rate: 1e-3
  out_channels: 97
  normalize_data: true
  weight_decay: 1e-4
  gradient_clip_val: null
  early_stopping:
    patience: 15
    mode: min
    monitor: val_loss

paths:
  data_dir: data/processed
  model_checkpoint: checkpoints/

wandb:
  run_name: null

random_seed: 42