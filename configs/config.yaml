defaults:
  - model: clifford
  - machine: hpc
  - _self_

train:
  epochs: 100
  learning_rate: 1e-3
  out_channels: 219
  normalize_data: true
  weight_decay: 1e-4
  early_stopping:
    patience: 15
    mode: min
    monitor: val_loss

paths:
  train_data: data/processed/train
  val_data: data/processed/val
  test_data: data/processed/test
  model_checkpoint: checkpoints/
