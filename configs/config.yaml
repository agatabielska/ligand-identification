defaults:
  - model: spectral
  - machine: hpc
  - _self_

data:
  max_points: 2000

batch_size: 256
seed: 42
  
train:
  epochs: 50
  learning_rate: 3e-3
  out_channels: 91
  normalize_data: true
  weight_decay: 5e-2
  gradient_clip_val: null
  loss:
    name: cross-entropy
    label_smoothing: 0.1
  early_stopping:
    patience: 3
    mode: min
    monitor: val_loss

paths:
  data_dir: data/unthresholded_transform_probabilistic
  model_checkpoint: checkpoints/

wandb:
  run_name: null
